name: SDSS Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full run, 02:00 UTC (10:00 MYT)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Push/PR runs chromium only; the nightly schedule runs all three.
        # A-005: keep traffic against the live store modest.
        project: ${{ github.event_name == 'schedule' && fromJSON('["chromium","firefox"]') || fromJSON('["chromium"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots (SPR-04 evidence)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.project }}
          path: test-results/
          retention-days: 14