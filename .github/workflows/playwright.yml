name: SDSS Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full run, 02:00 UTC (10:00 MYT)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Push/PR runs chromium only; the nightly schedule runs all three.
        # A-005: keep traffic against the live store modest.
        project: ${{ github.event_name == 'schedule' && fromJSON('["chromium","firefox"]') || fromJSON('["chromium"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots (SPR-04 evidence)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.project }}
          path: test-results/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

  # Publishes the Allure dashboard to GitHub Pages with run history.
  # Enable Pages first: Settings > Pages > Source = GitHub Actions.
  report:
    name: Publish Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Keep report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Carry previous history forward
        run: |
          mkdir -p allure-results/history
          if [ -d gh-pages/history ]; then cp -r gh-pages/history/. allure-results/history/; fi

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.12
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
